<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>INSPYRE Meet</title>
        <link rel="preconnect" href="https://api.fontshare.com" />
        <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap" rel="stylesheet" />
        <link id="shortcutIcon" rel="shortcut icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.svg" />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <link rel="stylesheet" type="text/css" href="../css/landing.css" />
        <link rel="stylesheet" type="text/css" href="../css/customizeRoom.css" />

        <!-- xss (provides filterXSS) -->
        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>
    </head>
    <body>
        <form class="scrim" id="customizeRoomForm" role="dialog" aria-modal="true" aria-labelledby="mtitle">
            <div class="modal">
                <div class="modal-head">
                    <div>
                        <div class="meta">customize room</div>
                        <h2 id="mtitle">A few cozy preferences.</h2>
                    </div>
                </div>

                <div class="body">
                    <div class="field">
                        <label for="room" class="lbl">Room name<small>The name of the room.</small></label>
                        <input id="room" name="room" class="text-input" type="text" placeholder="Room 123" required />
                    </div>

                    <div class="field">
                        <label for="name" class="lbl"
                            >Display name<small>Your display name which others will see.</small></label
                        >
                        <input id="name" name="name" class="text-input" type="text" placeholder="John Doe" value="" />
                    </div>

                    <div class="field">
                        <label for="avatar" class="lbl">Avatar URL<small>Leave empty to disable avatar.</small></label>
                        <input id="avatar" name="avatar" class="text-input" type="text" placeholder="https://..." />
                    </div>

                    <div class="field">
                        <label for="token" class="lbl"
                            >Token<small>Required when Host Protected or User Auth is enabled.</small></label
                        >
                        <input id="token" name="token" class="text-input" type="text" placeholder="JWT Token" />
                    </div>

                    <div class="field">
                        <label for="audio" class="lbl">Audio<small>Enable audio in the call.</small></label>
                        <label class="switch">
                            <input id="audio" name="audio" type="checkbox" />
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="field">
                        <label for="video" class="lbl">Video<small>Enable video in the call.</small></label>
                        <label class="switch">
                            <input id="video" name="video" type="checkbox" />
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="field">
                        <label for="screen" class="lbl"
                            >Screen<small>Allow others to present (share screen).</small></label
                        >
                        <label class="switch">
                            <input id="screen" name="screen" type="checkbox" />
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="field">
                        <label for="chat" class="lbl">Chat<small>Enable chat alongside the call.</small></label>
                        <label class="switch">
                            <input id="chat" name="chat" type="checkbox" />
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="field">
                        <label for="hide" class="lbl">Hide Me<small>Stay hidden from other participants.</small></label>
                        <label class="switch">
                            <input id="hide" name="hide" type="checkbox" />
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="field">
                        <label for="notify" class="lbl">Share<small>Enable sharing the join URL.</small></label>
                        <label class="switch">
                            <input id="notify" name="notify" type="checkbox" />
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="field">
                        <label for="duration" class="lbl"
                            >Duration<small>Format: HH:mm:ss. Leave empty for unlimited.</small></label
                        >
                        <input
                            id="duration"
                            name="duration"
                            class="text-input"
                            type="text"
                            placeholder="00:30:00"
                            inputmode="numeric"
                            placeholder="00:30:00"
                            pattern="^\d{2}:\d{2}:\d{2}$"
                            maxlength="8"
                        />
                    </div>

                    <div class="join-url-container">
                        <label for="crPreviewUrl" class="lbl">Join URL</label>
                        <div class="test">
                            <input id="crPreviewUrl" name="crPreviewUrl" class="text-input" readonly />
                            <button id="crCopy" class="dot-link" type="button">copy</button>
                            <button id="crShare" class="dot-link" type="button">share</button>
                        </div>
                    </div>

                    <div class="qr-container-wrapper">
                        <div id="crQr" class="qr-container"></div>
                        <small>Scan with your camera to open the join link.</small>
                    </div>
                </div>

                <div class="modal-foot">
                    <div class="secondary">
                        <button id="crCancelButton" class="dot-link" type="button">cancel</button>
                        <button id="crResetButton" class="dot-link" type="button">reset to defaults</button>
                    </div>
                    <button id="crSubmit" class="save" type="submit">
                        save &amp; start
                        <span class="arrow">
                            <svg
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M5 12h14" />
                                <path d="m13 6 6 6-6 6" />
                            </svg>
                        </span>
                    </button>
                </div>
            </div>
        </form>

        <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
        <script defer src="../js/customizeRoom.js"></script>
    </body>
</html>
