<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>INSPYRE Meet — landing options</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>html,body{margin:0;height:100%;background:#0E0E0E;font-family:-apple-system,system-ui,sans-serif;color:#fff}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const Frame = ({ src }) => (
    <iframe src={src} style={{ width: "100%", height: "100%", border: 0, background: "#EBEBEB", display: "block" }} title={src} />
  );
  ReactDOM.createRoot(document.getElementById("root")).render(
    <DesignCanvas title="INSPYRE Meet — pick a hero, plus the customize-room modal">
      <DCSection id="hero-options" title="Hero imagery — three directions">
        <DCArtboard id="hero-meet"  label="1 · giant 'm' + pearl + tube"      width={1440} height={900}><Frame src="meet-paper.html?hero=meet" /></DCArtboard>
        <DCArtboard id="hero-hello" label="2 · outlined 'hello.' + dots"      width={1440} height={900}><Frame src="meet-paper.html?hero=hello" /></DCArtboard>
        <DCArtboard id="hero-mono"  label="3 · monogram poster (ink plate)"   width={1440} height={900}><Frame src="meet-paper.html?hero=mono" /></DCArtboard>
      </DCSection>
      <DCSection id="modal" title="Customize room — modal">
        <DCArtboard id="modal-open" label="modal open over hero 1" width={1440} height={900}><Frame src="meet-paper.html?hero=meet&modal=1" /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
</script>
</body>
</html>
